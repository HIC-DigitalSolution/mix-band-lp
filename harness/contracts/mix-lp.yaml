name: mix-lp-contract
summary: このLPで「間違えると事故になる」箇所だけを、機械が毎回見張る。人の記憶とレビューには頼らない。

# なぜこのLP専用の契約が要るか。
#
# 素のHTML/CSSの1ページで、テストもステージングも無い。壊れても差分では見えず、
# 公開してから気づく。しかもこのLPは Y2K NIGHT LP の `#mix` セクションから
# 独立させたもので、**あちらで既に踏んだ穴の記録がある。**
# ここに書くのはそれだけ。想像上のリスクは書かない（誰も直さないので）。
#
# 共通ぶんはここに書かない:
#   - 秘密情報          → harness/contracts/secrets.yaml（symlink・設定不要で有効）
#   - 計画と検証の作法  → harness/contracts/workflow.yaml（同）
#   - LPの設計・CVR     → harness/contracts/lp-design.yaml（同・全て manual）
#
# 画づくりの判断基準は docs/design-docs/lp-visual-knowledge.md、
# 何をどの順で言うかは docs/design-docs/lp-cvr-knowledge.md。どちらも symlink。

inputs:
  - AGENTS.md
  - design/（カンプ）
outputs:
  - カンプの決定が docs/design-docs/ に残っていること
  - 変更が公開URLで意図どおり見えること

invariants:
  # ==== ここから機械が判定する ====

  # ---- Y2K の #mix で、支給バナーとページの記述が食い違っていた ----
  - id: no-superseded-or-invented-facts
    statement: 依頼者が取り下げた数字と、バナーの言い回しを、事実として本番HTMLに書かない。
    check:
      type: forbidden-content
      applies_to_paths:
        - ^index\.html$
      # 2026-09-07 に依頼者が確定させた4点で、旧記述は誤りになった。
      # 「最大4〜6組」は正しいので、'最大4組' は誤りだけを拾う（〜が挟まると一致しない）。
      forbidden_patterns:
        - '最大4組'
        - '一区切り'
        - '人数の指定は無い'
        - '人数指定なし'
        - '1日限り'
        - '20歳以上'
        - '身分証'
        - 'キャンセル料'
        - '当日キャンセル'
      hint: 'fix: 確定情報だけを書く（AGENTS.md「いま決まっていること」と docs/design-docs/content-structure-first-draft.md）。未確定は TODO(依頼者確認) のまま残す。**店舗名と各公式LINE URL の反映は最後の工程**（2026-09-09 の依頼者指示「リンクは最後にやる手段として覚えておいて」）—— 未支給を理由に他の作業を止めない。「1日限り」はバナーの言い回しで、意味は「1晩が完結する」。開催曜日の表示文言は「日〜木曜日限定」。'

  # ---- 1ページなので head が壊れると全損 ----
  - id: head-basics
    statement: title・description・og:title・lang が実際のタグとして在る。
    check:
      type: required-content
      applies_to_paths:
        - ^index\.html$
      required_patterns:
        - '<title'
        - 'name="description"'
        - 'property="og:title"'
        - '<html lang='
      hint: 'fix: index.html の head に足す。**素の文字列ではなくタグの形で判定している。**2026-09-08 に、この検査が `og:image` という文字列を **TODOコメントの中で拾って pass していた**（タグは0件）。契約が禁じている「何も検査していない green」そのものだった。公開時にだけ真になる og:image と og:url は og-image-and-index-before-release（manual）に移した。'

  # ---- 実測でFVが2.9MBだったことがある（Y2K） ----
  - id: image-budget
    statement: 公開する画像は1枚400KBまで。
    check:
      type: max-file-size
      applies_to_paths:
        - ^(img|assets)/(?!font/).+\.(png|jpg|jpeg|webp|gif|avif)$
      max_kb: 400
      hint: 'fix: 表示サイズまで縮めてWebPへ。Y2Kでは 2936KB → 126KB になった例がある。例外を足すなら理由とセットで exempt_paths に書く。'

  # ---- 支給素材はそのままだと重い（MIX-BAND.png は 1.1MB あった） ----
  - id: video-budget
    statement: 公開する動画は1本2MBまで。
    check:
      type: max-file-size
      applies_to_paths:
        - ^video/.+\.(mp4|webm|mov)$
      max_kb: 2000
      hint: 'fix: 19歳LPの実績は 179KB（カラオケの短いループ）。SPの回線で先頭が出るまでの時間が体験を決める。長い動画を置くなら poster を必ず付ける。'

  # ---- 開発サーバのURLが残ると本番で壊れる ----
  - id: no-local-urls
    statement: localhost や開発用URLを公開ファイルに残さない。
    check:
      type: forbidden-content
      applies_to_paths:
        - ^index\.html$
        - ^css/.+\.css$
        - ^js/.+\.js$
      forbidden_patterns:
        - 'http://localhost'
        - 'https://localhost'
        - '127\.0\.0\.1'
        - 'ngrok\.io'
      hint: 'fix: 相対パスか実URLに置き換える。確認用のポートは .claude/launch.json に閉じ込める。'

  # ---- カンプのダミーは許す。本番HTMLでは許さない ----
  - id: no-placeholder-copy-in-production
    statement: 仮の文言が本番HTMLに残らない。
    check:
      type: forbidden-content
      applies_to_paths:
        - ^index\.html$
      forbidden_patterns:
        - 'Lorem ipsum'
        - 'lorem ipsum'
        - 'ダミーテキスト'
        - 'サンプルテキスト'
        - 'ここに.{0,8}を入れる'
        - 'XXXXX'
        - '000-0000-0000'
        - 'example@example\.com'
      # design/ を対象に入れていないのは意図です。カンプは仮の文言で組むものなので、
      # ここで止めると探索そのものが止まります。
      hint: 'fix: 本文を実物に置き換える。未着手の節があるなら、仮文言を公開するのではなく節ごと隠す。カンプ（design/）では仮の文言のままでよい。'

  - id: images-have-alt
    statement: img には必ず alt がある。
    check:
      type: forbidden-content
      applies_to_paths:
        - ^index\.html$
      # alt= を1つも持たない <img ...> に当てる。
      forbidden_patterns:
        - '<img(?![^>]*\salt=)[^>]*>'
      hint: 'fix: alt を書く。装飾なら alt="" と書く。空の alt は答えだが、無いのは答えではない。文字が焼き込まれた画像なら、焼き込みの文言を全部 alt に入れる。'

  # ---- 参考にしたKBCのサイトに、この分岐が無かった ----
  - id: reduced-motion-is-handled
    statement: 動きを入れるなら、動きを止めたい人のための分岐も入れる。
    check:
      type: required-content
      applies_to_paths:
        - ^css/.+\.css$
      required_patterns:
        - 'prefers-reduced-motion'
      hint: 'fix: @media (prefers-reduced-motion: reduce) を書き、浮遊する装飾の animation を止める。装飾は止めても情報が減らない設計にする。**このLPはCSS1枚と決めている。**2枚目を足すとこの検査が2枚目にも同じ要求を出すので、そこで一度立ち止まること。参考にした kbc.co.jp/70th はこの分岐を持っていなかった（docs/design-docs/reference-sites.md）。'

  # ---- futuretrain から取った原則を、名前の存在だけ機械で担保する ----
  - id: color-ramp-tokens-exist
    statement: セクションの色は1本のランプから取る。ランプはトークンとして定義されている。
    check:
      type: required-content
      applies_to_paths:
        - ^css/.+\.css$
      required_patterns:
        - '--ramp-01'
        - '--ramp-02'
        - '--ramp-03'
        - '--ramp-04'
        - '--ramp-05'
        - '--ramp-06'
      hint: 'fix: :root に --ramp-01 から --ramp-06 を定義する。最新値はカンプ10（#24102E / #5B163F / #8D1B58 / #C91F70 / #E52683 / #FF2D95）。**機械が見られるのは名前が在ることだけで、各セクションが本当にランプから色を取っているかは見られない** —— そちらは section-colors-come-from-one-ramp（manual）。'

  # ---- 2026-09-08 の依頼者の指示。ページの持ち方を固定する ----
  - id: index-html-is-written-by-hand
    statement: index.html は手で書く。生成物にしない。
    check:
      type: forbidden-content
      applies_to_paths:
        - ^index\.html$
      forbidden_patterns:
        - 'Generated from'
        - 'Do not edit directly'
        - '<!-- include:'
      hint: 'fix: index.html を手書きに戻す。**依頼者が自分で開いて上から読める形にしておくのが要件**（2026-09-08の指示）。以前はここを src/index.html と src/sections/*.html から生成していたが、ページ1枚を見るのに5ファイル開く必要があり、しかも index.html を直しても次のビルドで消えていた。生成するのは css/style.css だけ。'

  - id: styles-are-per-section-sass
    statement: スタイルはセクションごとの Sass に分けて、style.scss がまとめる。
    check:
      type: required-content
      applies_to_paths:
        - ^src/scss/style\.scss$
      required_patterns:
        - '@use .sections/'
      hint: 'fix: セクションを足したら src/scss/sections/_<名前>.scss を作り、src/scss/style.scss に @use を1行足す。**index.html の section の class と1対1で対応させる**（.hero なら _hero.scss）。判定パターンの . は引用符に当たる（YAML内で引用符を書くのを避けているだけ）。'

  - id: css-is-compiled-not-handwritten
    statement: css/ は Sass の出力。手で書かない。
    check:
      type: required-content
      applies_to_paths:
        - ^css/.+\.css$
      required_patterns:
        - 'Generated from src/scss/style\.scss'
      hint: 'fix: css/style.css を手で編集しない。直すのは src/scss/。npm run build（node scripts/build.mjs）で吐き直す。**この見出し行が消えているのは、手で書き換えたか、別の経路で生成した合図。** **出力先は css/ だけ。**2026-09-09、`assets/css/style.css` と `.map` が湧いていた（依頼者も自分も作っていない）。中身は src/scss/ のコンパイル物だが1時間半古く、削除済みの .kicker がまだ8件残っていた。`scripts/build.mjs` は .map を書かないので、出所はエディタのSassコンパイラ拡張（Live Sass Compiler 等）のグローバル設定。**この検査は css/ しか見ないので、二つ目の出力が静かに食い違っていても気づけない。**見つけたら消す（`assets/` は .gitignore 済み）。拡張を使うなら出力先を css/ に向ける。'

  - id: sass-change-ships-its-css
    statement: Sass を変えたら、コンパイル済みの css も同じ差分に入れる。
    check:
      type: companion-required
      trigger_paths:
        - ^src/scss/
      companion_paths:
        - ^css/.+\.css$
      hint: 'fix: npm run build を走らせてから commit する。**入れ忘れると、公開されるのは古いCSSのまま。**しかも css/style.css を見ている検査（styles-are-per-section-sass 以外の css 系）は古い出力に対して pass するので、**気づけない。**'

  - id: production-images-live-in-img
    statement: 本番が参照する画像は img/ から参照する。design/ を参照しない。
    check:
      type: forbidden-content
      applies_to_paths:
        - ^index\.html$
        - ^css/.+\.css$
        - ^src/scss/.+\.scss$
      # コメントで design/ に言及するのは許す（決定の出どころを書くのは正しい）。
      # 禁じるのは「参照」の形だけ —— CSS/Sass は url()、HTML は src/href/poster/srcset/content。
      forbidden_patterns:
        - 'url\(\s*.?[^)]*design/'
        - '(src|href|poster|srcset|content)\s*=\s*.[^"'']*design/'
      hint: 'fix: 使う画像を img/ にコピーして、img/ から参照する（2026-09-08の指示）。**design/ はカンプの作業場で、公開対象ではない。**そこを本番から参照すると、画像予算の検査（image-budget は ^(img|assets)/ しか見ない）がすり抜けるうえ、カンプを整理した瞬間に404になる。**コメントで design/ の資料を引くのは問題ない** —— 判定しているのは url() と src/href の形だけ。'

  - id: image-files-live-in-img
    statement: 画像ファイルの置き場は img/ と design/ だけ。
    check:
      type: forbidden-path
      forbidden_paths:
        - ^src/.+\.(png|jpe?g|webp|gif|avif|svg)$
        - ^css/.+\.(png|jpe?g|webp|gif|avif|svg)$
        - ^[^/]+\.(png|jpe?g|webp|gif|avif|svg)$
      hint: 'fix: 本番で使うものは img/ へ、カンプの素材と書き出しは design/ へ。**リポジトリのルートや src/ に画像を置かない**（2026-09-08の指示）。どこに何があるか分からなくなると、公開時にどれを載せるのかが判断できない。'

  # ---- 実装引き継ぎ用の書き出しを、本番素材として誤参照しない ----
  - id: design-reference-artifacts-are-not-production-dependencies
    statement: カンプ確認用のPDF・WebPを、本番HTML・CSS・JSから参照しない。
    check:
      type: forbidden-content
      applies_to_paths:
        - ^index\.html$
        - ^src/index\.html$
        - ^css/.+\.css$
        - ^src/scss/.+\.scss$
        - ^js/.+\.js$
      forbidden_patterns:
        - 'mix-lp-content-design-reference\.(pdf|webp)'
      hint: 'fix: **このファイルは 2026-09-09 に削除済み。**カンプ引き継ぎ用の確認資料で、公開ページの画像ではなかった。この検査は「また置かないこと」の見張りとして残している。本番で必要な写真・SVGは個別の実素材を `img/` から参照する。'

  # ---- 横スライドの約束。守らないと「2枚が読まれないLP」になる ----
  - id: slider-has-no-autoplay
    statement: 横スライドを自動で送らない。読んでいる途中に内容が変わらないこと。
    check:
      type: forbidden-content
      applies_to_paths:
        - ^js/.+\.js$
      forbidden_patterns:
        - 'setInterval'
        - 'autoplay'
      hint: 'fix: 自動送りを外す。**読んでいる途中に勝手に内容が変わらないことを優先する**（docs/design-docs/overview-motion-spec.md）。いまカードの送りはスクロールだけで、JSは使っていない。カルーセルを回したくなったら、その前に「2枚目と3枚目が読まれているか」を測ること。'

  - id: stacked-cards-need-overflow-clip
    statement: セクションを overflow: hidden にしない。中の position: sticky が死ぬ。
    check:
      type: required-content
      applies_to_paths:
        - ^css/.+\.css$
      required_patterns:
        - 'overflow: clip'
        - 'position: sticky'
      hint: 'fix: セクションの切り抜きは **overflow: clip** で行う。**hidden はスクロールコンテナを作るので、その中の position:sticky が無効になる。**このプロジェクトで2回踏んでいる —— ヘッダー（.page が hidden で貼り付かなかった）と、YOUR NIGHT の重なるカード。装飾のはみ出しは clip でも同じように切れる。詳細は docs/gotchas/sticky-was-declared-not-verified.md。'

  - id: pc-layout-exists
    statement: PC幅のレイアウトを持つ。SP幅のまま中央に置いたままにしない。
    check:
      type: required-content
      applies_to_paths:
        - ^css/.+\.css$
      required_patterns:
        - '--page-max-pc'
        - 'min-width: 900px'
        - '--pc-edge'
      hint: 'fix: **これは lp-visual-knowledge §10「PCで横に広げない。カラムはSP幅のまま」から意図的に外れている。**2026-09-09 の依頼者指示で、futuretrain.jp と構造を揃えるためにPC幅のレイアウトを作った。**戻さないこと。**SPの見た目を変えずにPCだけ足す形にしてある（メディアクエリは min-width: 900px、コンテナは --page-max-pc = 1280px、左右 --pc-gutter = 80px）。**節の左右余白は固定の 80px ではなく --pc-edge = max(--pc-gutter, (100% - --pc-content) / 2) を使う**（--pc-content = 1280 - 80×2 = 1120px）。背景を全幅に走らせつつ中身の列を 1120px に留めるための値で、1280px以下では常に 80px を選ぶので以前と同一。'

  - id: no-purple-gutters-past-the-container
    statement: 1280px超の画面で、左右に body の地色の帯を出さない。
    check:
      type: forbidden-content
      applies_to_paths:
        - ^css/.+\.css$
      # .page を max-width: 1280px で中央に置くと、その外側に body の
      # background（--ramp-01 = #24102e）が帯で出る。1440で左右80px、1920で左右320px。
      # 2026-09-09 に依頼者が指摘した。**背景は全幅、中身の列だけ --pc-edge で 1120px。**
      forbidden_patterns:
        - 'max-width: var\(--page-max-pc\)'
      hint: 'fix: **.page に max-width を戻さないこと**（2026-09-09 の依頼者の指摘）。1280pxで切ると、それより広い画面の左右に body の地色 --ramp-01（#24102e）が帯で出る —— 1440で左右80pxずつ、1920で左右320pxずつ。**あれは意図した額縁ではなく、外側をどう見せるか決めていなかったせいで既定色が素通ししていたもの。**直し方は .page の上限を外し（PC節で max-width: none）、節・ヘッダー・フッターの左右余白を --pc-edge にする。参考の futuretrain も コンテナ1280 / 背景1440フルブリード で、帯は作っていない。**--pc-content と --pc-edge は _tokens.scss にある。**なお .hero__keyart の負のマージンは --pc-gutter（80px）のままにすること —— --pc-edge にすると画面端まで伸び、1920px超で支給素材 1920x1080 を原寸より拡大する。'

  # ==== ここから先は機械で判定できない ====

  - id: reference-seen-before-genre
    statement: 依頼者が参考にしている実物を見るまで、ジャンルと世界観を決めない。
    check:
      type: manual
      note: '**このプロジェクトで一度やっている。**「ラブ上等というネトフリ作品のパロディ感で」と言われたのに実物を見ず、「上等」の一語から「特攻服 → 金の刺繍 → ヤンキー漫画」と決めつけて実装した（Reggae One・金の二重縁取り・傾き・墨紫＋金）。実物は写真主体のキーアートで、金の刺繍も傾いた字も1つも無かった。全部捨てた。**作品名・店名・商品名が出たら、画像を1枚もらう。**「たぶんこういう系」で手を動かし始めない。推測でやったなら、コメントに「未確認」と書く。断定的なコメントは、次の人がそれを検証済みの事実として扱う。**ただし「ド派手ピンクとゼブラ柄の女子部屋」は参照ではない。**2026-09-07 に依頼者が「特定の部屋・作品を指しているわけではない」と明言した。**探しに行かないこと。**原本が無い以上、突き合わせる相手は依頼者の頭の中の像しかない。**その場合は突き合わせを入力側ではなく出力側でやる** —— コピーを入れず面積比だけの配色見本を先に1枚見せて、世界観をそこで決める。カンプ本体まで進んでから世界観がずれると、Y2K と同じ量を捨てることになる。'

  - id: facts-are-client-confirmed-only
    statement: 依頼者が確定させた事実だけを書く。それ以外は空欄で残す。
    check:
      type: manual
      note: 'イベントの核4点（2026-09-07）: ① 最大4〜6組のグループが交差する ② 金・土以外は開催期間中ずっと ③ チャイムが鳴り、そこからお題が出される ④ 恋愛リアリティ体験と言ってよい。追加情報（2026-09-08）: 対象は20〜30代の男女、来店前の期待は「いつもと違う刺激／関係が動くきっかけ／非日常」、ASOBIBARで恋愛リアリティショーを行っている、開催期間は2026年10月1日〜31日、参加条件はオレンジバンド、全店開催、CTAは店舗選択ダイアログから選んだ店舗の公式LINEへ移動する。店舗一覧は本文へ置かずダイアログ内だけに表示する。料金・受付時間・実績・お客さまの声は載せない。**依頼者指定の必須訴求は「恋愛リアリティ体験」「最大4〜6組」「日〜木曜日限定」の3語。**バナー内だけで済ませず、HTMLの読める文字として掲載する。**掲載場所はFVではない** —— 2026-09-09、依頼者の指示でFV直下の3点要約と開催期間カードを削除した（「CTAの左のところは全部消してください」）。**FVはバナーと予約ボタンだけ。**2026-09-09、レビューで「FVに開催期間を短く戻すべき」と指摘されたが、**依頼者の判断で戻さない** ——「下にもう情報があるからわざわざ載せる必要がない」。開催期間は開催情報セクション（10.01 — 10.31 / 日〜木曜日限定）にある。**FVへ日付を足し直さないこと。**（残る риск は、金・土を想定して来た人が開催情報まで読まないと気づかないこと。効かせる必要が出たら、カードではなく予約ボタン下の1行で足す。）3語は 概要=恋愛リアリティ体験 / 仕組み=最大4〜6組 / 開催情報=日〜木曜日限定＋2026年10月1日〜31日 に読める文字で残っている。**この3箇所を消すと訴求が本当に消える。**（2026-09-08にも、FV直下の日付を消す指示のときに3点まで巻き込んで消し、戻した経緯がある。）カップル成立は保証せず「関係が動くきっかけ」として表現し、再来店は参加者のメリットではなく運営側の成果として扱う。**イベントの中身は依頼者の判断であえて伏せている。**「チャイムが鳴るまで分からない」が訴求の軸で、中身を書くと軸ごと壊れる。'

  - id: parody-stays-generic
    statement: パロディの記号はジャンル一般のものだけ。実在番組の固有物は使わない。
    check:
      type: manual
      note: '使ってよい: 白抜き太ゴシックのテロップ帯、エピソード表記、ナレーション調のコピー。使わない: 実在番組のロゴ・タイトルの字組み・キーアート・配信社のマーク。商用ページで実在ブランドを流用すると、パロディの意図でも商標の問題になる。**この線引きは実装側の判断で、法務確認は取っていない。**公開前に依頼者に一度通すこと。'

  - id: rejected-directions-not-reproposed
    statement: 却下済みの案を作り直さない。
    check:
      type: manual
      note: '却下済み: **方向A「全部ウィンドウの中」**（2026-09-04・MIXで先行実装 → 同日「デザインがダメすぎる」で差し戻し。原因はウィンドウ枠・シークバーがデスクトップの言語で、寄せたかったバナーの言語ではなかったこと。1画面に2つの文法が入って寄せたい側が負けた）／**Reggae One と金の刺繍表現**（推測が出発点だった）／傾けた詰めた字。地に `#003ed6` をべた塗りで広げるのも駄目で、実測 彩度×明度 = 0.839（Y2KのCTAバー平均 0.449）。**べた塗りの面はCTAのために取っておく**（lp-visual-knowledge §2・§5）。'

  - id: key-art-is-a-supplied-banner
    statement: 支給バナーは現段階の仮置き素材で、最終キーアートは未決定。焼き込み文字を二重にしない。
    check:
      type: manual
      note: '支給物は `MIX-BAND.png`（1.1MB）で、Y2Kでは `mix-band-key.webp`（132KB）に変換して使った。**2026-09-07の依頼者指示で、現段階ではFVへ仮置きする。最終キーアートとして残すかは未決定。**仮置きでも生成画像内の再現を切り出さず、支給ファイルそのものを使う。ロゴもコピーも焼き込まれているので、HTML側に同じ文字段を重ねると二重になる。焼き込みの文言はaltへ全部入れる。SPでは焼き込みの小さい2行が約8pxで読めないため、判断に必要な確定事実だけ後続HTMLで再掲する。配色はバナーへの一致だけで固定せず、バナーを外してもページ側に高揚感が残るか確認する。'

  - id: comp-decisions-are-recorded
    statement: カンプで決めたことが docs/design-docs/ に文章で残っている。カンプの画だけを残さない。
    check:
      type: manual
      note: '残すのは「世界観の1つの決定」「彩度をどこに割り当てたか」「書体と字送り」「動きの物理法則」「情報の説得順」「捨てた案とその理由」。**2026-09-08の現在の情報順は、WHO / HERO → 共感・イベント理解 → 得られる体験 → 仕組み → 開催情報 → CTA。**実績・証拠、お客さまの声、独立した限定性は外す。料金・受付時間・店舗一覧も載せない。詳細は docs/design-docs/content-structure-first-draft.md。キャンバスだけが残ると、次に触る人は画から意図を逆算するしかない。`node scripts/harness/new-plan.mjs design-doc <slug> --title "..."`。'

  - id: implementation-handoff-is-versioned
    statement: 実装へ渡すカンプ・書き出し・決定文書の版を明記し、古い書き出しを最新版として扱わない。
    check:
      type: manual
      note: '**2026-09-08に依頼者がカンプ作業を止め、実装へ進んだ。2026-09-09、依頼者の指示でカンプ本体を全部削除した。**いまの基準は本番の index.html と src/scss/。 引き継ぎ資料 `img/mix-lp-content-design-reference.{pdf,webp}` も同時に削除した（公開前に外す約束だったものを、そのまま消した）。決定の所在は残っている —— FVは `content-design-comp-11.md`、端装飾は `content-design-comp-15.md`、人物SVGは `content-design-comp-16.md`、チャイム写真は `content-design-comp-17.md`、概要スライドの動きは `overview-motion-spec.md`。**書き出しファイル名だけでは版が分からない**という教訓は生きている —— 次に画を書き出すときは、元にした版と差分文書を同じ場所に必ず書く。'

  - id: implementation-respects-the-frozen-comp
    statement: カンプ停止後の実装で、決定済みの世界観・配色・情報順を独自に組み替えない。
    check:
      type: manual
      note: '**2026-09-09、カンプは削除した（[comps-were-deleted-implementation-is-the-reference]）。この項目は「canvas に従え」ではなく「決まった役割を勝手に変えるな」という意味で読む。**実装ではレスポンシブ、操作、`prefers-reduced-motion`、可読性をコードへ翻訳しつつ、**比較06の配色役割、SOUND TRIPの構成文法、横幅いっぱいのFV、支給された乾杯SVG、チャイム写真、Future Trainから翻訳した3枚の概要スライド、リボン不採用、ネオンピンクのCTA、オレンジを点・火花・短い罫に限る判断、確定済みの内容順**を保つ。**ただしゼブラの脱オレンジ・FVバナーの全面表示・PC用1920x1080への差し替えは、依頼者の指示で意図的に離れた。**変更が必要なら、本番コードだけで黙って変えず、決定文書（docs/design-docs/）とここの不変条件を先に更新する。'

  - id: floating-objects-follow-one-physics
    statement: 浮いているものを採用する場合は、1つの物理法則に従う。形と数には意味がある。
    check:
      type: manual
      note: '依頼者が挙げた kbc.co.jp/70th を実際に読んで取った技法（docs/design-docs/reference-sites.md）。**3層に分ける** —— div が配置、span/em が動き、svg/img が絵。1層1役で、混ぜると位置と動きが干渉する。**振幅は translateY / translateX で ±3〜5% だけ。**大きく動かすと浮遊ではなく移動になる。**duration を全部違う値にして（1.8s〜2.9s）、delay は振らない。**alternate-reverse と組むと、勝手に位相がずれ続けて二度と揃わない。素のCSS keyframesで足り、KBCもGSAPを使っていない。**2026-09-07の新しい設計ではリボンを採用しない方向。**過去の「リボン1本＝1組」は新案へ持ち込まない。浮遊物を置く場合は、ヤンキーネオンの世界観と関係する形を静止画で先に決め、飾りとして数を増やさない。浮遊物自体を置かない場合はこの項目は該当なし。焼き込み文字のあるバナー中央には重ねない。**CSSだけ読んで形を決めないこと。**形・塗り・質感・スケールは素材にしか無い。自分の出力も必ず描画して見る。'

  - id: section-colors-come-from-one-ramp
    statement: 新しい色を足さない。セクションの色は1本のランプの上から取る。
    check:
      type: manual
      note: '依頼者が挙げた futuretrain.jp を実際に読んで取った原則（docs/design-docs/reference-sites.md）。あちらは端点 #2b469c と #cf3792 の2つだけを決めて、中間色を全部その補間の上から取っていた。**移り変わりに見えるのは色を増やしたからではなく、色を1本に絞ったから。**比較05のコバルトブルー・ピンク・オレンジは同じ強さで競合した。**2026-09-08、依頼者が比較06を最も良いと判断した。現在の採用方向は濃紫 #24102E → 電気的な紫 #6338D4 → ラズベリーピンク #C91F70。**ネオンピンク #FF2D95 はCTAと細線、オレンジ #FF8A1F は小さな火花・点・短い罫だけに使う。比較07の広いブルーバイオレット面と大きなオレンジの光は採用しない。**読ませる面は強い色の流れに乗せない** —— 淡いピンク #F2D6DF と白 #FFF7FA のカードはページを通して不変。 **柄は地に合わせて2種持つ** —— 濃い地は #zebra（地 #24102E）、明るい地は #zebra-light（地 #F2D6DF・縞を細く）。1種類で通すと明るいセクションでそこが最強面になる。白×黒の縞は駄目で、ページ最大のコントラスト（白 S×V 0.039 × 黒 0.125）になりCTAより目を引く。**2026-09-09、依頼者の指摘で縞をオレンジからラズベリー #C91F70 とベリー #8D1B58 へ寄せた。これが現在の採用。**前日にオレンジへ振ったが、WHAT IS MIX 右上・YOUR NIGHT 右端・開催情報まわりで反復し、ページ全体がオレンジの柄物に見えていた。**オレンジは小さな火花・点・短い罫だけに戻す。**縞は地の色相の内側で明度だけずらす —— 柄は面の一部であって独立した色ではない。オレンジ版の比較記録は docs/design-docs/zebra-goes-orange.md（結論は破棄済み）。'

  - id: futuretrain-course-slide-grammar
    statement: イベント概要は、Future Trainの選択肢レールと詳細パネルの流れをMIXの3枚へ翻訳する。
    check:
      type: manual
      note: '依頼者が2026-09-08に指定した futuretrain.jp の Visitor Guide / Future Imagination Course を実際に確認した。借りるのは固有の文章・画像・ロゴ・色ではなく、**選択肢のレール → 同じ枠の詳細パネル → 次のカードへ進む流れ**だけ。**2026-09-08、依頼者の判断でこのスライド文法はこの節の3項目に適用した。**（見出しは 2026-09-09 に「いつもの夜を予定外に」→「いつもと違う夜に物語を」へ変更。英字の YOUR NIGHT は同日削除。）01 いつもと違う刺激／02 関係が動くきっかけ／03 非日常を体験。**確定事実（恋愛リアリティ体験・チャイム・最大4〜6組）はスライドにしない** —— それぞれ独立したセクションとして順に読ませる構成が既に確定しているので、スライドにすると重複する。（当初の案は 01 WHAT IS MIX → 02 CHIME → 03 CROSS だったが採らない。）後で実装する場合はカード幅を基準に1枚ずつ横へ進み、画像・見出し・本文を同期させる。デスクトップは矢印またはホイール、モバイルはスワイプ、次カードの端を少し見せ、自動再生はしない。詳細は docs/design-docs/overview-motion-spec.md。'

  - id: sound-trip-composition-frames-the-page
    statement: SOUND TRIPの構成文法を使い、色面と図形の大小・位置でページを組む。
    check:
      type: manual
      note: '依頼者が2026-09-07に構成ベースとして指定した on-the-trip.com/sound-trip を、1280px幅とナビが折り畳まれる703px幅で実際に確認した（docs/design-docs/reference-sites.md §3）。**借りるのは構成文法だけ。**① 1色の広い地に、隣接色の巨大な有機形を1つ置く ② セクション境界へ10〜25%ほど食い込ませ、直線で切らない ③ 中央を可読域として空け、装飾は左右端・四隅・境界へ寄せる ④ 図形は大1＋小1を基本単位にし、同種情報は同じ輪郭で反復する ⑤ 終盤でFVの濃紫へ戻してCTAを独立した面にする。**SOUND TRIPのシアン #26C7D1、赤 #CF264A、ロゴ、人物イラスト、SVGの輪郭は流用しない。**2026-09-08に採用方向となった比較06の濃紫 #24102E、電気的な紫 #6338D4、ラズベリーピンク #C91F70を地と光へ割り当てる。オレンジ #FF8A1F は小さな火花・点・短い罫だけに使う。ゼブラ柄は端から入る形の一部へクリップし、本文や仮置きバナーの焼き込み文字の背面へ置かない。**固定CTAは2026-09-09に採用した**（依頼者の指示「FVのすぐ下のCTAが見えなくなったら、下に予約できるCTAがずっとついてくる感じで」）。CVは店舗選択→公式LINEの1つに絞れているので条件は満たしている。**出す条件は「FVのCTAが画面の上へ抜けきったとき」で、「見えていない」ではない** —— PCではFVのCTAが折り返しの下に来るので、後者だと読み込み直後から出てしまう。**下のCTAセクションが見えている間は出さない**（同じボタンが2つ並ぶ）。実装は `js/sticky-cta.js`。**IntersectionObserver は使わない** —— 最下部から一気に最上部へ戻るとFVのCTAは「画面の上」から「画面の下」へ移るだけで交差状態が変わらず、通知が来ずバーが出たままになる。**rAFで間引かない** —— 間引きフラグがrAFの走らない状況で立ちっぱなしになり、以後まったく更新されなくなった。スクロールのたびに矩形2つを読むだけにしてある。JSが無い環境では `hidden` のまま出ないが、FVと下のCTAはHTMLに在るので何も壊れない。**静止カンプ04の外周のざらつきは仮表現。実装ではセクション専用SVGで滑らかな外形を作り、CSSは配置・色・重なりを担当する。**CSSのborder-radiusだけで汎用的なblobにしない。質感を残す場合も輪郭を荒らさず、SVG内へクリップする。SPで本文へ干渉する場合は配置用SVGを切り替える。**2026-09-08の背景見直しでは、区間ごとに専用SVGを1枚ずつ置き、大きな色面・中間の輪郭線またはゼブラ・小さな火花または点の3段階を持たせる。巨大なアウトライン文字は画面外で切り、本文中央を空ける。**実装カンプでは375px幅で描画し、中央の可読域、図形の食い込み、輪郭のジャギー、横スクロールを目視する。'

  - id: paradox-live-fv-translation
    statement: 全面FVのレイヤーと動きを参考サイトから読み、MIX向けに翻訳する。
    check:
      type: manual
      note: '依頼者が2026-09-08に指定した https://paradoxlive.jp/5thanniversary/ を実画面で確認した（docs/design-docs/content-design-comp-11.md）。参考FVは横幅いっぱいの背景・メインビジュアル・手前の装飾・端のロゴを別レイヤーで重ね、背景は3秒周期のbrightness変化、観客は0.3秒の小さな上下動を使っていた。導入には音のON/OFFとSKIPがあるが、MIXでは初回から内容を読ませるため導入画面と音声許可は採用しない。借りるのは全面ビジュアル、端のロゴ、複数レイヤー、控えめなループだけ。Paradox Liveのロゴ、写真、色、チケットや紙片の素材は流用しない。MIXでは支給バナーの上部44pxを決定的にカットし、左上のASOBIBARロゴ、写真の微細なズーム、光の呼吸、端の光線を採用する。人物・メインタイトル・下部コピーは変更せず、画面を覆う演出にしない。'

  - id: human-motif-keeps-the-scene-human
    statement: 幾何学背景へ人のモチーフを1組だけ加え、交流が始まる意味を伝える。
    check:
      type: manual
      note: '依頼者が2026-09-08に追加した方向。カンプ12の単純な塊と、カンプ13の大きな上半身ポーズは採用しない（canvas は削除済みで、判断だけが残る）。カンプ14・15でスケールと端装飾を調整した後、依頼者支給の乾杯SVG（本番は `img/mix-toast-couple.svg`、原本は `design/assets/mix-toast-couple.svg`）を1組の装飾レイヤーとして採用する。SOUND TRIPのように大きな有機形の端へ小さな人物・波線・記号をまとめ、2人の向きと中央のオレンジのグラスで「交流が始まる」ことを示す。素材の形・色・重なりを再描画せず、本文中央・焼き込みタイトル・日付・CTAから離す。人物記号は静止させ、動くのは既存の写真・光・端の光線だけ。決定と配置理由は docs/design-docs/content-design-comp-16.md に残す。'

  - id: output-is-rendered-and-seen
    statement: 見た目の成果物は、人に見せる前に画像へ描画して自分の目で見る。
    check:
      type: manual
      note: '**2026-09-07 に依頼者から明示的に指示された。**同日、描画を確認せずに publish して3回続けて差し戻している —— ① 平面を積んだだけでコンセプトが画に出ていない ② リボンが「ぐみみたい」（CSSは正確に読んだのに素材画像を一度も開いていなかった）③ CTAが支給バナーの「全員オレンジバンド」バッジと同じオレンジのピルで、FVにボタンが2つ縦に並んでいた（バナーの絵を見ずに数値だけで決めていた）。**どれも一度描画すれば即座に分かるもので、数値やコードを読むだけでは絶対に出てこない。**手順は tools/render.sh <file> [幅]。経路は qlmanage で、**この環境のヘッドレスChromeは45秒で返ってこない**（フィルタの有無に無関係・原因未特定）。**Artifact形式の .dc.html は doctype も charset も持たないので、付けずに描画すると UTF-8 が化けて「見たつもりで何も読めない」**（render.sh が包む）。**ブラウザペインは隠れていると白く写るので確認に使えない。**描画を見たら、配色や構成を変えたあとに**古い記述がボードや注記に残っていないか**も確かめる。詳細は docs/gotchas/read-the-css-not-the-artwork.md。'

  - id: og-image-and-index-before-release
    statement: 公開の前に、og:image と og:url を絶対URLで入れて noindex を外す。
    check:
      type: manual
      note: '**機械では判定しない。**「絶対URLとして正しいか」「もう公開してよいか」は機械に見えないし、開発中ずっと落ち続ける検査はいずれ --no-verify で外される。**og:image が無いとSNSの共有カードが真っ白になる**。og:image と og:url は**絶対URLでないとクローラが拾わない**（19歳LPで踏んだ）。いまの index.html は robots noindex で、head に TODO(依頼者確認) が残っている。**公開先が決まったら3つ同時にやること** —— og:image を足す・og:url を足す・noindex を外す。**2026-09-08 に、この項目を機械検査に書いていたら TODOコメントの文字列を拾って pass していた。**判断が要るものを機械に持たせるとこうなる。'

  - id: page-structure-is-readable-by-the-client
    statement: 依頼者が自分で開いて読める形を保つ。
    check:
      type: manual
      note: '**2026-09-08 の依頼者の指示。**「index.html に記述して、各セクションごとに Sass コンパイルで管理して、自分で見やすくできる形にしたい」。つまり —— **ページの構造は index.html 1枚を上から読めば全部わかる**（include もテンプレートも挟まない）。**セクションごとに区切りコメントを置く**（hero / about / schedule / footer）。**section の class と src/scss/sections/_<名前>.scss を1対1で対応させる。**画像は **img/** に置く。**これは好みではなく、依頼者本人が触るための要件**なので、効率や DRY を理由に崩さないこと。セクションを増やすときは、index.html に区切りコメント付きで足す → 同じ名前の Sass パーシャルを作る → style.scss に @use を足す → npm run build、の順。'

  - id: stacked-cards-appear-on-scroll
    statement: 「いつもと違う夜に物語を」の3枚は、スクロールで重なりながら現れる。JSは使わない。
    check:
      type: manual
      note: '**2026-09-08、依頼者の指定で futuretrain.jp の Future Imagination Course と同じ作りにした。**実物を開いて実装を読んで取った —— **JavaScriptは一切使っていない**（scroll駆動アニメーションのCSSも0件）。**2026-09-09 に1440pxで再計測して裏を取った** —— `window.gsap` / `ScrollTrigger` / `Swiper` はいずれも undefined、`scroll-snap-type` と `scroll-snap-align` を持つ要素は0、`animation-timeline` / `scroll()` / `view()` を含むCSSルールも0。読み込まれている js は Next.js のチャンクと `three.min.js`・`splide-shader-carousel.min.js`（**別の横カルーセル用**）と計測タグだけ。**外部で作られた解析資料に注意** —— 2026-09-09、依頼者から `future-train-harness.md` という解析資料を受け取ったが、「CSS Scroll Snap で吸い付く」「GSAP ScrollTrigger でピン留め」「Swiper Vertical」と書かれており、**実物に当てると全部違った。**（唯一合っていたのは「カードは100vh」で、実物は `md:h-svh`。当LPは内容の高さのままにする判断。）**この種の資料をそのまま取り込まないこと。実物に当てて確かめる。**資料自体はリポジトリに置いていない —— 誤りが再輸入されるため。**作り方:** ① セクション内にカードを縦に並べる ② **1枚目だけ position: sticky; top で上に貼り付ける** ③ **2枚目以降に clip-path: inset() を持たせる** —— これで後続が前の上をせり上がって覆う ④ **親セクションは overflow: clip**（hidden にすると sticky が死ぬ）。**守ること:** **3枚とも常にDOMに在る**（JSで隠さない。読み上げ・検索・JS無効でも全部読める）。**2026-09-09、依頼者から3枚ぶんの本文が支給された。**番号は見出しの行に置く（`.stack__head`）、本文はその下でカード幅を使う（`.stack__text`）。本文は PC18px / SP15px。**支給された改行はPCの行取り** —— `<br class="br-pc">` で、375pxでは無効にして自然に流す（その位置だと2文字だけ落ちる行が3箇所出た）。**日本語の禁則は `body` で担保している** —— `overflow-wrap: anywhere` はどの文字間でも折るので禁則が死ぬ（小書きカナが行頭に来る）。`break-word` ＋ `line-break: strict` にしてある。**戻さないこと。** **2026-09-09、依頼者の指示（B）で PC のカードを実物と同じ構成にした** —— 1枚＝画面高（`calc(100svh - var(--header-h-pc))`。ヘッダーが白い不透明の sticky なのでその分を引く）、**左45%が文字・右55%が写真**、カードは画面幅いっぱい（`margin-inline: calc(50% - 50vw)`）、枠・角丸・影は無し。**向こうは左3割・右7割だが、こちらは45/55にしている** —— 支給写真が4人の集合写真1枚（1902x827）しかなく、写真枠を7割にすると切り出し幅942pxが必要で、3枚が重なって1枚目と2枚目がほぼ同じ絵になった（実際に切って並べて確認）。55%なら786px幅で主役を3人に割り当てられ、原寸ほぼ等倍で出せる。**写真素材が増えたら7割へ寄せてよい。SPは従来どおり4:3のまま**（1枚1画面にすると節が3画面ぶんになり「長い」という指摘と逆になる。向こうも `md:` 以上だけ）。写真はSP用 660x495 とPC用 786x827 の2種を `<picture>` で出し分ける。**踏んだ罠を2つ残す** —— ① `<picture>` を挟むとグリッドの子は img ではなく picture になる。配置と高さは picture へ効かせること ② グリッドの行を暗黙の auto のままにすると子の `height:100%` が auto に落ち、写真が本来の比で伸びてカードからはみ出す（1920pxで97px。1440pxではたまたま一致していて気づけなかった）。`grid-template-rows: minmax(0, 1fr)` を明示する。 **2026-09-09、1440pxで実物を再計測して1点訂正した** —— 以前ここに「カード間に隙間を空けない」と書いていたが、**実物は `mt-14`（56px）を空けている。**推測で書いていた。当LPは隙間0のままで問題なく重なっているので変えないが、「隙間があると重ならない」は誤り。**カードの中身を埋める。**最初は1行＋1文だけで min-height を持たせたが、**白が余って未完成に見えた。**2026-09-08、依頼者の判断で写真を足した —— 支給された MIXBAND-CHIME01.png（1902x827）から**人物ごとに 660x495 で3枚切り出し**、4:3でカード上端に敷いている。**別々の人・別々の表情を選ぶこと。**カードは重なって1枚ずつ見えるので、同じ場面から切っても並んで見えることはないが、**同じ人が2枚に写ると使い回しに見える**（1枚目に2枚目の主役が入っていて切り直した）。min-height はもう持たせていない。写真が高さを作る。**JSを足したくなったら、その前に「JS無しで何が壊れるか」を言えること。**いまは何も壊れない。仕様は docs/design-docs/overview-motion-spec.md。'

  - id: pc-grammar-comes-from-futuretrain
    statement: PC幅の組み方は futuretrain から取った文法に従う。節は増やさない。
    check:
      type: manual
      note: '**2026-09-09、依頼者の指示。**「構造は一緒にしたほうがいい」「まずはLPサイズを作ってその後にSPサイズ」。実物を1440幅で開いて数値を取った —— **コンテナ1280px（左右80px）／英字の節見出し96px／和文見出し32px／本文18px・行間1.9・字間0.9px／横並びが基本（2カラムのブロックが69個）**。MIXへの持ち込み方: 本文 18px・行間1.9／各節を横並びにする（CHIMEは本文左＋写真右、YOUR NIGHTのカードは写真左＋本文右）。**英字の節見出し（kicker）は使わない** —— 2026-09-09、依頼者の指示で全セクションから削除した（「タイトルの上にいつもついてる英語のやつ、基本的にいらない」）。futuretrain は英字96pxを節の顔にしているが、そこは borrow しない。**節の顔は和文見出し（PC38px / SP24px）。**背景の巨大なアウトライン文字（AFTER DARK・REALITY NIGHT・CHIME・OCT 2026・STEP IN）は見出しではなく端の装飾なので残している。**節は増やさない** —— futuretrain には What is New・Station Map・Space・Access・Credit・FAQ があるが、こちらは「実績・声・料金・受付時間・FAQの空枠は置かない」「店舗一覧はダイアログ内だけ」が確定済みで、背骨は既に一致している。**2026-09-09、依頼者の指示でFVのバナーは全面表示にした。**それまではPCで列を720pxに止めて原寸超えを避けていたが、「全面で表示させたい」が優先。当初は 750x583 しかなく1.71倍に伸びていたが、**同日 PC用 1920x1080 が支給され、`img/mix-band-key-pc.webp`（305KB）として入れた。1280幅では0.67倍の縮小になり拡大は解消した。**SPは 750x583 のまま（PC版は16:9で、375px幅だと帯になって焼き込み文字が読めない）。切り替えは `<picture>` の `media="(min-width: 900px)"`。**枠に縦横比を固定しないこと** —— 2つの素材は比が違うので、枠を決め打ちにすると `object-fit: cover` が焼き込み文字を切る。`height: auto` で画像に高さを決めさせる。**gridのトラックに auto / max-content を使わないこと** —— 全列にまたがるバナーの実寸1920pxが列幅として効き、`overflow: clip` の内側で右が切れる（横スクロールが出ないので気づきにくい）。**2026-09-09、FVは「画面幅いっぱいのバナー＋中央の予約ボタン」だけになった**（依頼者の指示で要約3点と開催期間を削除）。バナーは `margin: 0 calc(50% - 50vw)` でページの列から抜けて画面幅になる（50vw は縦スクロールバーを含むので、`.page` に `overflow-x: clip` を置いて受ける。clip なので sticky は生きる）。**焼き込み文字の上に何も重ねない**という判断は維持。**メディアクエリは各セクションのパーシャルに書く**（section の class と _<名前>.scss を1対1にする規約を崩さない）。**2026-09-09、依頼者の指摘で「1280px超の左右に紫の帯が出る」を直した。**.page を 1280 で切っていたので、外側に body の地色 --ramp-01（#24102e）が素通ししていた（1440で左右80px、1920で左右320px）。**コンテナ1280 は捨てていない** —— .page の上限を外して背景を全幅に走らせ、中身の列は --pc-edge = max(--pc-gutter, (100% - --pc-content) / 2) が 1120px に留める。**1280px以下では max() が常に 80px を選ぶので、そこまでの見た目は以前と1pxも変わらない。**futuretrain も コンテナ1280 / 背景1440フルブリード だった。**431〜899px には同じ帯が残っている**（SPの .page は max-width: 430px のまま）。中身の列幅まで動くので、SPサイズの作り直しと一緒にやる。'

  # ---- 2026-09-09、依頼者の指摘「ハーネス機能させてください」。
  #      それまで見た目の決まりは全部 type: manual で、**何も検証していなかった。**
  #      この節は「実際に落ちる検査」だけを置く。増やすときも同じ基準で。
  - id: spacing-comes-from-the-scale
    statement: 余白は _tokens.scss の間隔スケールから取る。生の px を書かない。
    check:
      type: forbidden-content
      applies_to_paths:
        - ^src/scss/.+\.scss$
      forbidden_patterns:
        - '(?:padding|margin|gap|row-gap|column-gap)[a-z-]*:[^;{}]*?\b(?!(?:0|1|4|8|12|16|20|24|32|40|48|56|64|80|96|120|160)px\b)\d+px'
      hint: 'fix: `var(--sp-N)` を使う。スケールは 4/8/12/16/20/24/32/40/48/56/64/80/96/120/160px（_tokens.scss）。**2026-09-09 までスケールが無く、実際の padding が19種類ばらついていた**（5/6/7/9/10/13/14/15/18/19/22/23/25/26/27/34/44/72/76/88/92/102/106/108/118/150/170px）。依頼者の指摘「余白はこのくらい取るとか一度スキルとして入れておいてと言ったのが適用されていない」への対応。**スケール外がどうしても要るなら、まず本当に要るのかを疑い、要るなら理由をコメントに書いたうえでこの検査の許可リストへ足す。**黙って例外にしない。1px は .sr-only の定型（margin: -1px）のために許してある。'

  - id: no-dark-bands-at-tablet-widths
    statement: .page に幅の上限を戻さない。431〜899px で地色の帯を出さない。
    check:
      type: forbidden-content
      applies_to_paths:
        - ^src/scss/_base\.scss$
      forbidden_patterns:
        - '\.page\s*\{[^}]*max-width:\s*var\(--page-max\)'
      hint: 'fix: `.page { max-width: none }` のままにする。430px で切ると、それより広い画面の左右に body の地色（--ramp-01 #24102e）が帯で出る —— **768pxで左右169px、899pxで234px**（2026-09-09 のレビュー指摘。「スマホ版を中央に置いただけ」に見える）。背景は全幅に走らせ、中身の列は各節の `--sp-edge`（900px未満）と `--pc-edge`（900px以上）が留める。どちらも `max(余白, (100% - 列幅) / 2)` で、狭い画面では余白側が選ばれるので見た目は変わらない。'

  - id: japanese-line-breaks-follow-sentence-units
    statement: 日本語の本文は文の単位で折る。文が行の途中から始まらないようにする。
    check:
      type: manual
      note: '**2026-09-09、依頼者の指摘「改行の位置がキモすぎる」「今回の適切な改行は句点で区切るのがベスト」。** 実測した崩れ方 —— 390px で「ドキッとすることも。**「もう少し話してみた** / **い」そんな気持ちが**〜」と、**文が行の途中から始まり、鉤括弧が2行に割れていた。**また「夢中になる**いつもと**ひ / と味違う」と、意味の切れ目が無視されて繋がっていた。 **やり方** —— 支給コピーの1行＝1つの単位として `<span class="u">` で包み、CSSで `display: inline-block` にする。**入り切らない単位は丸ごと次の行へ送られる**ので、文が行の途中から始まらない。**幅に関係なく効く。** ```html <p><span class="u">ドキッとすることも。</span><span class="u">「もう少し話してみたい」</span></p> ``` **`<br>` を使わないこと** —— 幅ごとに正解が違うので、PC用に `<br>` を置くと SP で崩れ、SPで消すと今度は意味の切れ目が失われる。実際に一度その往復をしている。 **単位の切り方** —— ① 句点（。）の後ろで必ず切る ② 鉤括弧（「」）は割らない ③ 支給コピーに改行があるなら、作者が意図した文節の切れ目なので尊重する。 **列幅が足りないと単位が内部で割れる** —— 2026-09-09、375pxで列が285pxしかなく「思わず笑ったり 予想外の展開に驚いたり。」（20文字＝300px）が入らず「たり。」が落ちた。`--sp-edge` の最小を24px→16pxにして列を301pxにし、全12行が単位どおりに収まった。**単位のいちばん長い行が列幅に収まるかを実測すること。** **確かめ方（目視で決めない）** —— 文字を1つずつ Range で走査して、上端が変わったところを行の切れ目として拾い、実際の行を配列で出す。4文字以下の行が出たら折り方を疑う。'

  - id: boxes-center-on-both-axes
    statement: 箱の中に文字を置くときは、必ず上下左右とも中央にする。片方だけ指定しない。
    check:
      type: manual
      note: '**2026-09-09、依頼者から2度目の指摘。**「ボックスに対して上下の余白が違う＝中央じゃない」「この前も同じ現象が起きていました」。**原因はいつも同じで、片方の軸しか指定していないこと。** 実測した例 —— テロップを `display: grid; justify-items: center;`（横だけ）で1つのセルに重ねていた。縦は既定の `stretch` のままなので箱が引き伸ばされ、文字が上に張り付いた。**上13px / 下41px**。`place-items: center` にして 上13 / 下13（差0）になった。 **決まり** —— ① grid / flex で中央に置くときは **`place-items: center` か `place-content: center`** を使う。`justify-*` だけ、`align-*` だけを書かない。 ② 同じセルに要素を重ねる（`grid-area: 1 / 1`）ときは特に注意。**一番背の高い要素に合わせて全部が伸びる。** ③ 親を中央にしても、**箱自身が伸びれば同じことが起きる**ので、箱側にも `place-content: center` を置く。 ④ `line-height` と `padding` を左右対称に書いても中央にはならない。**箱が伸びているかどうかが本体。** **確かめ方（目視で決めない）** —— 要素の矩形と、中の文字の行ボックスを取って上下の差を測る。差が1px以内でなければ中央ではない。 ```js const b=el.getBoundingClientRect(); const r=document.createRange(); r.selectNodeContents(el); const t=r.getBoundingClientRect(); ({上:Math.round(t.top-b.top), 下:Math.round(b.bottom-t.bottom)}) ``` **中央に置いたと報告する前に、この数字を出すこと。**'

  - id: reference-motion-is-watched-not-inferred
    statement: 参考サイトの「動き」は、計測値ではなく実際の動きを見て判断する。
    check:
      type: manual
      note: '**2026-09-09、これで丸ごと1往復を無駄にした。**依頼者が mememe-official.jp の動きを「かなり好き」と指定したのに、私は `.concept` の文字要素の computedStyle を1回スナップショットして「animation なし・transition 0s」、`ScrollTrigger.getAll()` が0件、という**数値だけ**で「単純なフェード。GSAPは実質使っていない」と断定した。そのまま実装し、依頼者に「全然アニメーションが違う」と指摘されてやり直した。実物は **canvas（WebGL）で3Dの世界を毎フレーム描画し、スクロールでカメラとシーンごと変わる**もので、CSSのフェードとは表現の種類が違った。依頼者の言葉「非常に非効率です」。 **手順（動きを判断する前に必ず全部やる）** —— ① **時間差でスクリーンショットを撮って並べる。**読み込み直後 / 1秒後 / 3秒後 / スクロール中を最低4枚。**これを飛ばさない。**動きは1枚の絵にも computedStyle にも写らない。 ② **canvas と video の有無を先に見る。**`document.querySelectorAll(canvas, video)` と `getContext(webgl)`。**あればCSSでは再現できない**ので、その時点で「同じにはできない」と依頼者へ伝える。素材（3Dモデル・動画）の話に切り替える。 ③ スクショを撮るときは **tabId を明示する**（別タブを撮っていたことが実際にあった）。 ④ 対象要素が合っているか確かめる。**私は最初、FVではない要素を見ていた**（`.concept` は最上部＝FVそのものだった）。`document.elementFromPoint(innerWidth/2, innerHeight/2)` で画面中央に何があるか確認する。 **してはいけない推論** —— 「`ScrollTrigger.getAll()` が0件」→「動きがない」。`once: true` で破棄されることがあり、canvas 側は別の仕組みで動く。**0件は「動きがない証拠」にならない。** 「`animation-name: none` かつ `transition-duration: 0s`」→「動きがない」。**アニメーション完了後に見ればどちらもそうなる。** **報告のしかた** —— 動きについて述べるときは「何を見て言っているか」を必ず添える。スクショを並べていないなら「まだ見ていない」と書く。'

  - id: mememe-full-bleed-panel-grammar
    statement: 全面写真の上に読ませるパネルを作るときは、黒の乗算ではなく地色のウォッシュで作る。
    check:
      type: manual
      note: '依頼者が2026-09-09に指定した mememe-official.jp の concept セクションを1440pxで実測した（docs/design-docs/reference-sites.md §4）。**依頼者の見立てと実装が1つ違う** —— 「黒の乗算をかけて読ませる」と想定されていたが、実物は `.concept__bg::before` に**ブランド色（ミント #00F8B0）を opacity .3** でかぶせている。**黒を乗せると写真が灰色に寄って色が死ぬ。**MIXの写真はネオンの色が唯一の武器なので、被せるなら**濃紫 #24102E**（ランプの端点）を使う。**借りる文法** —— ① 全面写真＋被せ＋白文字（`text-shadow` なし。影で読ませようとしない） ② 本文は1行につき1要素、中央揃え、**行間2.0・字間0.08em** ③ 節タイトルは描き起こしのレタリング画像（向こうは `concept_ttl.svg`） ④ ボタンは字間の広いピル（0.17em）。**借りないもの** —— ミント、3Dの島のアート、ロゴ、文章。**GSAPも入れない** —— 向こうは GSAP + ScrollTrigger だが、concept の文字は**初回1度だけ**で、離れて戻っても再生されない（`ScrollTrigger.getAll()` は0件）。同じ見え方は IntersectionObserver ＋ CSS transition ＋ 1行ごとの delay で足りる。JSが無ければ「最初から見えている」だけで何も壊れない。**タイトルのレタリングはFVと同じ字形にすること** —— 別の字形を起こすと、ページに2つ目の視覚言語が増えて「パーツ同士の不一致」が悪化する（2026-09-09 のレビューで最大の問題として指摘された点）。**白文字の可読性は必ず実測する** —— 被せの不透明度は写真ごとに変わる。目視で決めない。**マスクは PNG で作る** —— `mask-image` に WebP を渡すと computed値は入るのに要素ごと消える（2026-09-09 に実測。docs/gotchas/webp-alpha-does-not-work-as-a-css-mask.md）。**マスク・フィルタ・ブレンドを足したら必ず一度スクショを撮る** —— 例外を投げずに静かに消えるので、computed値では気づけない。**2026-09-09 に導入した** —— 背景は `img/intro-scene.webp`、被せは濃紫の縦グラデーション（.58 → .88）、白文字の最悪コントラストは **6.77:1**（写真の最も明るい画素で計算。AA本文基準4.5を上回る）。タイトルは依頼者支給の `img/mix-logo.webp`（FVと同じ字形）。**出現アニメーションは `js/reveal.js`** —— `[data-reveal]` の子を1つずつ 0.09s ずらして出す。**既定は「見える」で、隠すのはJSが `is-armed` を付けたときだけ** —— 逆にするとJSが落ちた瞬間に本文が消える。`prefers-reduced-motion` では `is-armed` の隠しを打ち消す保険を別途置いてある（全体の reduce ルールが transition を消すので、それが無いと opacity:0 で固まる）。一度出したら `unobserve` する（戻るたびに再生すると読み返しの邪魔になる）。'

  - id: japanese-line-breaking-stays-on
    statement: 日本語の禁則を殺さない。overflow-wrap: anywhere を書かない。
    check:
      type: forbidden-content
      applies_to_paths:
        - ^src/scss/.+\.scss$
      forbidden_patterns:
        - 'overflow-wrap:\s*anywhere'
        - 'word-break:\s*break-all'
      hint: 'fix: `overflow-wrap: break-word` を使う。**anywhere はどの文字間でも折れるようにするので、日本語の禁則が効かなくなる** —— 2026-09-09、「恋愛リアリテ / ィ体験です。」と小書きカナが行頭に来ていた。`break-word` でも、収まらない長い英数字列のはみ出しは防げる。body には `line-break: strict` も置いてあり、拗促音と長音符を行頭へ送らない。**両方とも戻さないこと。**'

  - id: crops-use-explicit-coordinates
    statement: 画像の切り出しに sips の --cropOffset を使わない。
    check:
      type: forbidden-content
      applies_to_paths:
        - ^(tools|scripts)/.+$
      forbidden_patterns:
        - 'sips\s+-c\s[^\n]*cropOffset'
      hint: 'fix: 切り出しは PIL で座標指定する（`tools/slice.py` が例）。**`sips --cropOffset 0 0` は左上ではなく中央を切り、非ゼロを渡したときだけ左上からの絶対座標になる**（2026-09-09 に PIL と突き合わせて確定）。1枚目だけ中央が出るという分かりにくい壊れ方をする。実際に、カード写真を左端から切ったつもりが中央が出て、1枚目と2枚目がほぼ同じ絵になった。'

  # ---- 2026-09-09、依頼者の指示でカンプ（.dc.html とスタディPNG）を全部削除した。
  #      「カンプにしか無かった知識」をここへ移している。以下は canvas を開けない前提で読む。
  - id: banner-measurements-decide-the-cta
    statement: CTAの色と最強面の根拠は、支給バナーの実測に置く。彩度の数値だけで決めない。
    check:
      type: manual
      note: '**カンプを消しても残す数値。**支給バナーの高彩度画素は **赤〜橙 78.8% / ピンク・マゼンタ 4.5%**。だから **CTAはオレンジにしない** —— バナーに焼き込まれた「全員オレンジバンド」のピルと同じ色のピルが2つ並び、どちらがボタンか分からなくなる（2026-09-07、描画して初めて分かった）。**CTAが最強面である根拠は彩度ではない** —— オレンジ単体は S×V 0.878 で、CTAのネオンピンク #FF2D95 の 0.824 より強い。根拠は **「べた塗りの面積」と「バナーがほぼ持たない色相」** の2点で、**べた塗りの面はCTAのために取っておく**（周囲のセクションで同じ色を面に使わない）。ランプの割り当ては 01 #24102E 濃紫の地 / 02 #5B163F 仕組みの暗い面 / 03 #8D1B58 境界の有機形 / 04 #C91F70 イベント理解の広い光 / 05 #E52683 ネオンの線・小面積 / 06 #FF2D95 **CTAだけ**。**読ませる面（淡いピンク #F2D6DF・白 #FFF7FA）はランプに乗せない。**マスタード #D97706（0.827）はオレンジと役目が重なるので採用しない（依頼者提示の配色ガイド①「主役はマスタード」から、ここだけ外している）。実測の手順と元データは docs/design-docs/reference-sites.md §4。'

  - id: japanese-headings-cap-at-24px-on-sp
    statement: SPの日本語見出しは375px幅で24pxが上限。
    check:
      type: manual
      note: '**カンプ工程で実測した上限。**26pxにすると12文字で折り返して崩れた（375px幅）。英字の kicker は別枠で、PCでは58pxまで上げてよい（futuretrain の96pxからの翻訳）。**この上限は「小さくしておけば安全」という話ではない** —— 本文は逆に上げていて、2026-09-09 の指摘でSP本文15px・補足11.5〜12pxまで戻している。見出しだけが折り返しで崩れるので上限を持つ。'

  - id: ribbon-vocabulary-if-it-ever-returns
    statement: リボンは不採用。再検討するときだけ、3回作り直して得た形の語彙から始める。
    check:
      type: manual
      note: '**2026-09-09、素材（design/assets/ribbon-sprite.svg と生成器 ribbon-gen.py）ごと削除した。**形の語彙だけここに残す —— **針状のテーパー／色違いの平行な束／幅の広い端の返し／太い帯の波打つ下辺／裏面は後ろから覗く細い筋**。これは実物の素材画像から取ったもので、**3回作り直した結果**（①太さ一定の管＝「ぐみみたい」と差し戻し ②破った紙 ③バラバラの弧 → ④束）。CSSのborder-radiusや均一な弧から始めると①〜③に戻る。**2026-09-07以降の設計ではリボンを採用しない。**2026-09-09 の指摘でも「リボンは追加しない」が明示されている。復活させるなら、まず静止画で形を決め、必ず描画して見ること。'

  - id: content-funnel-order-and-what-was-dropped
    statement: 説得順は依頼者提示のファネル図を出発点にし、落とした節は理由ごと覚えておく。
    check:
      type: manual
      note: '**依頼者が提示したファネル図（design/references/content-funnel-order-reference.png、2026-09-09 に削除）の順**は —— 誰に？・キャッチ → 共感・理解 → メリット → 仕組み → 実績・証拠 → お客さまの声 → オファー → 限定性 → CTA。**MIXではここから落としたものがある** —— 実績・証拠、お客さまの声、独立した限定性（いずれも materials が無く、作れば嘘になる）、料金、受付時間、FAQの空枠。**店舗一覧は本文に置かず、CTAの店舗選択ダイアログ内だけ。**残った背骨が現在の イベント理解 → 体験価値 → 仕組み → 開催情報 → 公式LINE。**空いた節を埋めたくなったら、まず「その情報は依頼者から来ているか」を確認する** —— 来ていなければ節ごと置かないのが正しい。参照図の色・ピル・矢印は流用しない。'

  - id: comps-were-deleted-implementation-is-the-reference
    statement: カンプは削除済み。いまの基準は本番の index.html と Sass であって、canvas ではない。
    check:
      type: manual
      note: '**2026-09-09、依頼者の指示で design/ のカンプ（mix-lp-comp-01〜07、mix-lp-content-design-comp-08〜17 の .dc.html と描画PNG、配色スタディ04〜07、ワイヤーフレーム08〜10、references/、img/mix-lp-content-design-reference.{pdf,webp}）を全部削除した。**残したのは依頼者支給の素材（design/assets/ の写真・ロゴ・乾杯SVG・PC用バナー原本）と、決定を書いた docs/design-docs/content-design-comp-08〜17.md だけ。**古い文書がまだ canvas のパスを書いている**（AGENTS.md・pre-code-design-blueprint.md・完了済みexec-plan）。**そのパスを見に行かないこと。存在しない。**画が見たいときは本番を tools/render.sh で描く。**「凍結したカンプに従う」はもう成立しない** —— 実装はカンプから意図的に離れている（ゼブラの脱オレンジ、FVバナーの全面表示とPC用1920x1080への差し替え、スクロールで重なるカード、PC幅レイアウト）。**画を変えるときは、canvas を作り直すのではなく、決定を docs/design-docs へ書き、ここの不変条件を更新してから本番を触る。**'
