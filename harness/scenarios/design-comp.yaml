name: design-comp-scenario
summary: カンプを起こす順番。前提を決めてから画を作る。逆にすると、あとから構成ごとやり直しになる。
stage: manual

# なぜ pre-commit / pre-push ではなく manual か。
# ここに書いてあるのは全部「決めたか」「見たか」で、実行できるコマンドが1つも無い。
# 実行できないものを実行段に置くと、走らないシナリオが1本増えるだけになる。
# `harness-check` を走らせた人に毎回読ませたいので、シナリオとして置いている。

steps:
  - AGENTS.md を読む。確定している事実・却下済みの案・推測で埋めない項目はそこにある。
  - 依頼者が参考にしている実物を手元に置く。画像を1枚もらう。**見るまでジャンルを決めない**（一度やっている。mix-lp.yaml の reference-seen-before-genre）。
  - 参考がURLなら、**CSSと素材画像の両方**を見る。CSSは振る舞いしか語らない。形・塗り・質感・スケールは素材にしか無い。curl で1枚落として sips -s format png で変換して見る（一度、技法だけ読んで形を見ずに差し戻された。docs/gotchas/read-the-css-not-the-artwork.md）。
  - 今回の構成ベースは **on-the-trip.com/sound-trip**。1色の広い地、境界へ食い込む巨大な有機形、中央の可読域、大1＋小1の非対称配置、終盤でFVの暗色へ戻る流れをカンプへ入れる。元サイトの色・ロゴ・人物・SVG輪郭は流用しない（mix-lp.yaml の sound-trip-composition-frames-the-page）。
  - 支給素材がFVを占めるなら、**その色相分布を実測する。**CTAはその素材が持っていない色相から選ぶ。彩度×明度の単調増加だけではページ最強面は決まらない（バナーの実測は docs/design-docs/reference-sites.md）。
  - CV1つ・ペルソナと流入文脈・目標CVR を決めて exec-plan に書く。デザインの好みではなく前提。node scripts/harness/new-plan.mjs task <slug> --title "..."
  - docs/design-docs/lp-cvr-knowledge.md を読む（何をどの順で言うか）。10要素のうち欠けるものは、欠かす理由を書く。
  - docs/design-docs/lp-visual-knowledge.md を読む（画づくり）。**世界観は1つの決定で作る。彩度とべた塗りの面はCTAのために取っておく。**
  - どの色をCTAに割り当てるか先に決める。地の彩度を上げるなら、CTAがページで一番強い面であることを実測で確かめる（彩度×明度。Y2Kの実測値は mix-lp.yaml にある）。
  - カンプを design/ に .dc.html で起こす。仮の文言でよい。ただし**確定していない事実を、確定した書き方で置かない。**
  - '**描画して自分の目で見る。tools/render.sh <file> [幅] で PNG にする。**見ないまま人に見せない（2026-09-07 に3回続けて差し戻した）。ブラウザペインは隠れていると白く写るので確認に使えない。**先頭が * や & で始まる行は、シングルクォートで囲むこと** —— 囲まないと YAML がエイリアス記法と解釈して、ハーネスの定義ごと読み込めなくなる（2026-09-08 に踏んだ。harness-check はシナリオを読まないので気づけず、commit 時の harness-run で初めて落ちた）。'
  - 描画を見て、**ボードや注記に古い記述が残っていないかを確かめる。**配色を変えたら説明文も変わる。矛盾したまま見せると、どちらが決定なのか誰にも分からなくなる。
  - node scripts/harness/harness-check.mjs を走らせ、[manual] の行を全部読む。lp-design.yaml の9〜10行がカンプの採点表。
  - 決めたことを docs/design-docs/<slug>.md に書く。捨てた案とその理由も書く。**画だけ残すと、次に触る人は意図を逆算するしかない。**
  - 依頼者に見せる。差し戻されたら、何が駄目だったかを AGENTS.md の「却下済み」に足す。同じ案を2回出さないため。
  - 本番HTMLに落とすのはここから。カンプは成果物ではなく、決定が成果物。
